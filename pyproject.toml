[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-state-guard"
version = "0.1.0"
description = "Deterministic state-graph orchestration and fallback mechanics for multi-agent LLM workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayodele Kolawole James" }]
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]
postgres = ["psycopg[binary]>=3.1", "sqlalchemy>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
